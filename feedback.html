  <main id="main-content">
    <section class="form-container">
      <h2>Student Feedback</h2>

      <form action="#" method="POST">
        <p>
          <label for="fbName">Name:</label>
          <input type="text" id="fbName" name="fbName" required aria-required="true">
        </p>

        <p>
          <label for="fbEmail">Email:</label>
          <input type="email" id="fbEmail" name="fbEmail" required aria-required="true">
        </p>

        <p>
          <label for="fbMsg">Message:</label>
          <textarea id="fbMsg" name="fbMsg" rows="4" cols="30" style="resize: none;" required aria-required="true"></textarea>
        </p>

        <p class="form-actions">
          <button type="submit">Submit</button>
        </p>
      </form>
    </section>
  </main>
