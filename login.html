<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StudentHub Login">
  <title>Login | StudentHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>StudentHub Portal</h1>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="login.html" aria-current="page">Login</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section class="form-container">
      <h2>Student Login</h2>

      <div id="loginAlert" class="login-alert-box" style="display:none;"></div>
      <form id="loginForm" action="dashboard.html" method="POST">
        <p>
          <label for="loginEmail">Email Address or Enrollment Number:</label>
          <input type="text" id="loginEmail" name="loginEmail" required aria-required="true">
        </p>

        <p>
          <label for="loginPassword">Password:</label>
          <input type="password" id="loginPassword" name="loginPassword" required aria-required="true">
        </p>

        <p class="form-actions">
          <button type="submit">Login</button>
        </p>
      </form>

      <p>Don't have an account? <a href="register.html">Register here</a>.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 StudentHub Academic Portal | College Project</p>
  </footer>

  <script src="js/script.js"></script>

</body>
</html>
